name: Release (version bump + CHANGELOG)

# Runs python-semantic-release on pushes to main (and manual/nightly).
# semantic-release analyses conventional commits since the last tag,
# bumps the version, updates CHANGELOG.md, creates a git tag, and
# publishes a GitHub Release.  If no releasable commits exist it's a no-op.

on:
  workflow_dispatch:    # Manual only — click "Run workflow" in GitHub Actions

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release needs full history
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release build

      - name: Run semantic-release (version + CHANGELOG + tag + GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish

name: fluxito-prod

# Production deployment for the self-hosted Fluxito instance.
#
# Builds the app image from the LOCAL source checkout (no registry image) and
# runs it with isolated Postgres + Redis volumes. The prod host holds a git
# clone and tracks `main`; deploy with deploy/update.sh.
#
# Run from the repo root:
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
# (--env-file feeds ${POSTGRES_PASSWORD}/${APP_BASE_URL} interpolation; env_file:
#  below injects the full app env into the app container.)

services:
  nginx:
    container_name: fluxito-prod-nginx
    image: nginx:alpine
    ports:
      - "8010:80"   # Change if you need a different host port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Static assets served directly by nginx, straight from the source tree
      # (the prod host has a full checkout — no image/volume copy needed).
      - ../app/static:/app/app/static:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    container_name: fluxito-prod-app
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/fluxito
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8010}
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 384M

  db:
    container_name: fluxito-prod-db
    image: postgres:15
    environment:
      POSTGRES_DB: fluxito
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      postgres
        -c max_connections=80
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c work_mem=4MB
        -c log_min_duration_statement=2000
    volumes:
      - fluxito_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxito"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    container_name: fluxito-prod-redis
    image: redis:7-alpine
    command: >
      redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy volatile-ttl
    volumes:
      - fluxito_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  fluxito_postgres_data:
  fluxito_redis_data:

{% extends "base.html" %}
{% block head_extra %}
<link rel="stylesheet" href="/static/css/ask.css?v={{ asset_hash('css/ask.css') }}"/>
{% endblock %}
{% block main %}
<div class="ask-shell" id="ask-shell">
  <aside class="ask-history">
    <button class="ask-new" id="ask-new">+ New chat</button>
    <ul class="ask-conv-list" id="ask-conv-list"></ul>
  </aside>
  <main class="ask-main">
    <div class="ask-messages" id="ask-messages">
      <div class="ask-empty" id="ask-empty">
        <h2>Ask Fluxito</h2>
        <p>Ask about your analytics, tracking plan, dashboards, or marketing data.</p>
        <p class="ask-setup-hint" id="ask-setup-hint" hidden>
          No AI provider key yet — <a href="/settings?tab=ai">add one</a> to start.
        </p>
      </div>
    </div>
    <form class="ask-composer" id="ask-composer">
      <div class="ask-composer-inner">
        <textarea id="ask-input" rows="1" placeholder="Ask Fluxito…"></textarea>
        <button type="submit" id="ask-send">Send</button>
      </div>
    </form>
  </main>
</div>

{% endblock %}
{% block scripts %}
<script src="/static/js/ask.js?v={{ asset_hash('js/ask.js') }}" defer></script>
{% endblock %}

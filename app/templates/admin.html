{% extends "base.html" %}
{% block title %}Admin — Fluxito{% endblock %}
{% set active = 'admin' %}

{% block main %}
<main class="app-main">
  <div class="page-head">
    <div>
      <span class="label">Admin</span>
      <h1>Instance <em class="serif-italic">administration.</em></h1>
      <p>Manage users and access requests. <span class="t-flag" style="margin-left:8px;background:var(--ink);color:var(--bg);">Super Admin</span></p>
    </div>
  </div>

  <div class="tabs" style="margin-bottom:24px;">
    <button class="tab is-active" data-tab="users" onclick="adminTab('users')">Users</button>
    <button class="tab" data-tab="requests" onclick="adminTab('requests')">Access Requests</button>
  </div>

  <section data-panel="users">
    <table class="ps-table"><thead><tr><th>Email</th><th>Name</th><th>Status</th><th>Super-admin</th><th></th></tr></thead>
      <tbody id="usersBody"><tr><td colspan="5">Loading…</td></tr></tbody>
    </table>
  </section>

  <section data-panel="requests" style="display:none">
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <input type="checkbox" id="gateToggle" onchange="toggleGate(this.checked)">
      Require access approval (gate open sign-up)
    </label>
    <div id="reqMsg" class="ps-msg" style="display:none"></div>
    <table class="ps-table"><thead><tr><th>Name</th><th>Email</th><th>Use case</th><th></th></tr></thead>
      <tbody id="reqBody"><tr><td colspan="4">Loading…</td></tr></tbody>
    </table>
  </section>
</main>

<style>
.ps-msg {
  padding: 8px 14px; border-radius: var(--r-m);
  font-size: 12.5px; line-height: 1.5;
  display: inline-block; margin-bottom: 16px;
  border: 1px solid var(--line-2);
  background: var(--bg-2); color: var(--ink-soft);
}
.ps-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ps-table thead tr { border-bottom: 1px solid var(--line); }
.ps-table th {
  text-align: left; padding: 14px 18px;
  font-weight: 600; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); font-family: var(--mono);
}
.ps-table tbody tr { border-bottom: 1px solid var(--line-2); }
.ps-table tbody tr:last-child { border-bottom: none; }
.ps-table td { padding: 14px 18px; vertical-align: middle; }
.btn.sm.danger-outline { border-color: var(--red, crimson); color: var(--red, crimson); }
</style>

<script>
function adminTab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('is-active', b.dataset.tab===t));
  document.querySelectorAll('[data-panel]').forEach(p=>p.style.display = p.dataset.panel===t ? '' : 'none');
}
async function api(url, opts){ const r = await fetch(url, opts); const d = await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.detail||d.error||d.message||'Failed'); return d; }
async function loadUsers(){
  const {users} = await api('/api/admin/users');
  const tbody = document.getElementById('usersBody'); tbody.innerHTML='';
  users.forEach(u=>{
    const tr=document.createElement('tr');
    [u.email, u.display_name||'', u.is_active?'Active':'Inactive', u.is_superadmin?'Yes':'No'].forEach(v=>{const td=document.createElement('td'); td.textContent=v; tr.appendChild(td);});
    const act=document.createElement('td'); act.style.textAlign='right';
    const b1=document.createElement('button'); b1.className='btn sm'; b1.textContent=u.is_active?'Deactivate':'Activate'; b1.onclick=()=>setActive(u.id,!u.is_active);
    const b2=document.createElement('button'); b2.className='btn sm'; b2.style.marginLeft='6px'; b2.textContent=u.is_superadmin?'Revoke admin':'Make admin'; b2.onclick=()=>setSuper(u.id,!u.is_superadmin);
    act.appendChild(b1); act.appendChild(b2); tr.appendChild(act); tbody.appendChild(tr);
  });
}
async function setActive(id,v){ try{ await api(`/api/admin/users/${id}/active`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_active:v})}); loadUsers(); }catch(e){ alert(e.message);} }
async function setSuper(id,v){ try{ await api(`/api/admin/users/${id}/superadmin`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({is_superadmin:v})}); loadUsers(); }catch(e){ alert(e.message);} }
async function loadRequests(){
  const {requests} = await api('/api/admin/access-requests?status=pending');
  const tbody=document.getElementById('reqBody'); tbody.innerHTML='';
  if(!requests.length){ const tr=document.createElement('tr'); const td=document.createElement('td'); td.colSpan=4; td.textContent='No pending requests.'; tr.appendChild(td); tbody.appendChild(tr); return; }
  requests.forEach(r=>{
    const tr=document.createElement('tr');
    [r.name, r.email, r.use_case||''].forEach(v=>{const td=document.createElement('td'); td.textContent=v; tr.appendChild(td);});
    const act=document.createElement('td'); act.style.textAlign='right';
    const b1=document.createElement('button'); b1.className='btn sm primary'; b1.textContent='Approve'; b1.onclick=()=>approve(r.id);
    const b2=document.createElement('button'); b2.className='btn sm danger-outline'; b2.style.marginLeft='6px'; b2.textContent='Reject'; b2.onclick=()=>reject(r.id);
    act.appendChild(b1); act.appendChild(b2); tr.appendChild(act); tbody.appendChild(tr);
  });
}
async function approve(id){
  try{
    const d=await api(`/api/admin/access-requests/${id}/approve`,{method:'POST'});
    const m=document.getElementById('reqMsg'); m.textContent = d.temp_password
      ? `Approved ${d.email}. Share these credentials (shown once): ${d.email} / ${d.temp_password}`
      : `Approved ${d.email} (existing account — no new password).`;
    m.style.display='block'; loadRequests();
  }catch(e){ alert(e.message); }
}
async function reject(id){ try{ await api(`/api/admin/access-requests/${id}/reject`,{method:'POST'}); loadRequests(); }catch(e){ alert(e.message);} }
async function toggleGate(v){ try{ await api('/api/admin/settings/require-access-approval',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:v})}); }catch(e){ alert(e.message); document.getElementById('gateToggle').checked=!v;} }
loadUsers(); loadRequests();
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ title or "Connection successful" }} — Fluxito{% endblock %}

{% block main %}
<main class="app-main" style="max-width:600px;text-align:center">
  <div class="audit-empty" style="padding-top:60px">
    <div style="font-size:56px;margin-bottom:16px">{{ icon or "✅" }}</div>
    <h3 style="font-size:28px;font-weight:500;letter-spacing:-0.02em;color:var(--ink)">{{ title or "Connected successfully" }}</h3>
    {% if message %}
    <p style="max-width:440px;margin:10px auto 0;color:var(--ink-soft);line-height:1.6">{{ message }}</p>
    {% endif %}
    <div style="display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap">
      <a href="/connect" class="btn">Manage connections</a>
      <a href="/home" class="btn primary">Go to dashboard →</a>
    </div>
  </div>
</main>
{% endblock %}

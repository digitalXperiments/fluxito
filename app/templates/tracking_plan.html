{% extends "base.html" %}
{% block title %}Tracking Plan — Fluxito{% endblock %}
{% set active = 'tracking_plan' %}

{% block head_extra %}
{{ super() }}
<link rel="stylesheet" href="/static/css/tracking_plan.css?v={{ asset_hash('css/tracking_plan.css') }}"/>
<script>
  // First Tracking Plan visit only: collapse the global sidebar so the first
  // impression is the roomy workspace. Any later manual toggle wins (we set the
  // 'autocollapsed' flag once and never override the user's choice again).
  (function () {
    try {
      if (localStorage.getItem('fx-tp-autocollapsed') === null) {
        localStorage.setItem('fx-tp-autocollapsed', '1');
        localStorage.setItem('fx-sidebar-collapsed', '1');
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) {}
  })();
</script>
{% endblock %}

{% block main %}
<div class="tp-shell">
  <div id="tp-banner" class="tp-banner" style="display:none"></div>
  <div class="tp"
       id="tp-app"
       data-pid="{{ project_id }}"
       data-uid="{{ user.id if user else '' }}"
       data-admin="{{ 'true' if user and (user.is_superadmin or (user.permissions and user.permissions.full)) else 'false' }}">
    <div class="tp-empty">Loading tracking plan…</div>
  </div>
</div>
<script src="/static/js/tracking_plan.js?v={{ asset_hash('js/tracking_plan.js') }}"></script>
{% endblock %}

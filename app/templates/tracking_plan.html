{% extends "base.html" %}
{% block title %}Tracking Plan — Fluxito{% endblock %}
{% set active = 'tracking_plan' %}

{% block head_extra %}
<link rel="stylesheet" href="/static/css/tracking_plan.css?v={{ asset_hash('css/tracking_plan.css') }}"/>
{% endblock %}

{% block main %}
<div class="tp-shell">
  <div id="tp-banner" class="tp-banner" style="display:none"></div>
  <div class="tp"
       id="tp-app"
       data-pid="{{ project_id }}"
       data-uid="{{ user.id if user else '' }}"
       data-admin="{{ 'true' if user and (user.is_superadmin or (user.permissions and user.permissions.full)) else 'false' }}">
    <div class="tp-empty">Loading tracking plan…</div>
  </div>
</div>
<script src="/static/js/tracking_plan.js?v={{ asset_hash('js/tracking_plan.js') }}"></script>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ title or "Error" }} — Fluxito{% endblock %}

{% block main %}
<main class="app-main" style="max-width:640px">
  <div class="audit-empty" style="padding-top:60px">
    <div style="font-size:52px;margin-bottom:18px;color:var(--muted)">{{ icon or "⚠" }}</div>
    <h3 style="font-size:28px;font-weight:500;letter-spacing:-0.02em;color:var(--ink)">{{ title or "Something went wrong" }}</h3>
    {% if message %}
    <p style="max-width:460px;margin:10px auto 0;color:var(--ink-soft);line-height:1.6">{{ message }}</p>
    {% endif %}
    <div style="display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap">
      {% if back_url %}<a href="{{ back_url }}" class="btn">← Back</a>{% endif %}
      <a href="/" class="btn primary">Home</a>
    </div>
  </div>
</main>
{% endblock %}
